name: Tests

on:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        # --frozen-lockfile fails on any lockfile drift so CI catches inadvertent dep bumps.
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test
